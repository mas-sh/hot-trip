<mat-form-field appearance="outline">
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }
  <input matInput [type]="type()" [placeholder]="placeholder()" [formControl]="control" />
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  @if (errorMessage()) {
    <mat-error>{{ errorMessage() }}</mat-error>
  }
</mat-form-field>
